[project]
name = "atenviz"
version = "0.1.0"
description = "Capture a PyTorch model as a hierarchical ATen graph with FLOP and weight-traffic counts, and view it in the browser"
readme = "README.md"
license = "MIT AND EPL-2.0"
license-files = ["LICENSE", "atenviz/viewer/vendor/ELK-LICENSE.md"]
requires-python = ">=3.12"
dependencies = ["torch>=2.15"]

[project.scripts]
atenviz = "atenviz.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "torchvision", "transformers>=4.50"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atenviz"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
