<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="bar">
  <div id="examples" class="seg" role="radiogroup" aria-label="Example model" hidden></div>
  <div id="title"><span id="model-name">Model Viewer</span><span id="model-meta"></span></div>
  <div id="totals"></div>
  <div id="controls">
    <input id="search" type="search" placeholder="Search modules and ops" autocomplete="off" aria-label="Search modules and ops">
    <button id="show-views" aria-pressed="false" title="Show view ops (reshape, permute, expand, ...). They do not move data.">Views</button>
    <button id="show-const" aria-pressed="false" title="Show constant-foldable ops: ops that read only weights and constants. Their outputs count as weights.">Constants</button>
    <button id="expand-all" title="Open every module">Expand all</button>
    <button id="collapse-all" title="Show only the modules of the first view">Collapse all</button>
    <button id="fit" title="Fit the graph to the window (F)">Fit</button>
    <label class="button" title="Open a model_viewer graph JSON file">Open file<input id="file" type="file" accept=".json,application/json" hidden></label>
  </div>
</header>
<main>
  <aside id="tree" aria-label="Module hierarchy"></aside>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="tooltip" class="card" hidden></div>
    <div id="status" class="card">Drop a model_viewer graph JSON file here, or use Open file.</div>
    <div id="legend" class="card"></div>
  </div>
  <aside id="details" aria-label="Details"><p class="hint">Select a module, an op or a wire.</p></aside>
</main>
<script src="vendor/elk.bundled.js"></script>
<script id="graph-data" class="graph-data" type="application/gzip-base64"></script>
<script src="viewer.js"></script>
</body>
</html>
